<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मी आज पासून दारू सोडली</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#b91c1c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script>
    // जर युझरची नोंदणी आधीच झाली असेल तर थेट मेन ॲपवर पाठवा
    if (localStorage.getItem('userName')) {
      window.location.replace('./app.html');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      text-align: center;
      padding: 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .cover-img {
      width: 100%;
      max-width: 260px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 1.85rem;
      color: #b91c1c;
      margin-bottom: 14px;
      font-weight: 800;
    }
    .counter-box {
      background-color: #fee2e2;
      color: #991b1b;
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 28px;
    }
    .btn-install {
      background-color: #dc2626;
      color: #ffffff;
      border: none;
      padding: 16px 28px;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 6px 16px rgba(220, 38, 38, 0.35);
      display: none;
      margin-bottom: 14px;
    }
    .btn-start {
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 50px;
      font-weight: 700;
      display: inline-block;
      width: 100%;
      max-width: 320px;
      font-size: 1.05rem;
    }
    footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: #64748b;
    }
    footer a {
      color: #2563eb;
      text-decoration: none;
      margin: 0 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="./cover.png" alt="STOP DRINK" class="cover-img" onerror="this.style.display='none'">
    
    <h1>मी आज पासून दारू सोडली</h1>
    
    <div class="counter-box">
      ५,२३,८४७+ लोकांनी संकल्प केला
    </div>

    <button id="installBtn" class="btn-install">
      📲 ॲप इन्स्टॉल करा
    </button>

    <a href="./register.html" class="btn-start">सुरुवात करा &rarr;</a>
  </div>

  <footer>
    <p>
      <a href="https://www.punepoona.in" target="_blank">punepoona.in</a> • 
      <a href="https://www.claimtak.in" target="_blank">claimtak.in</a> • 
      <a href="https://www.navinpune.com" target="_blank">navinpune.com</a>
    </p>
  </footer>

  <script>
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isAlreadyInstalled = localStorage.getItem('pwaInstalled') === 'true';

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    if (!isStandalone && !isAlreadyInstalled) {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = 'block';
      });

      setTimeout(() => {
        if (!isStandalone && !isAlreadyInstalled && installBtn) {
          installBtn.style.display = 'block';
        }
      }, 1000);
    } else {
      if (installBtn) installBtn.style.display = 'none';
    }

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            localStorage.setItem('pwaInstalled', 'true');
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
        } else {
          alert('ॲप इन्स्टॉल करण्यासाठी:\nवर उजव्या कोपऱ्यातील ३ डॉट्सवर (⋮) क्लिक करा आणि "Install and create shortcut" निवडा.');
        }
      });
    }

    window.addEventListener('appinstalled', () => {
      localStorage.setItem('pwaInstalled', 'true');
      if (installBtn) installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
