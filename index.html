<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मी आज पासून दारू सोडली</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#b91c1c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="दारू सोडली">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
      padding: 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .cover-img {
      width: 100%;
      max-width: 280px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.7rem;
      color: #b91c1c;
      margin-bottom: 12px;
      font-weight: 800;
    }
    .counter-box {
      background-color: #fee2e2;
      color: #991b1b;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 24px;
      display: inline-block;
    }
    
    /* थेट होम पेजवर दिसणारे इन्स्टॉल बटन */
    .btn-install {
      background-color: #dc2626;
      color: #ffffff;
      border: none;
      padding: 16px 28px;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
      display: block; /* हे बटन स्क्रीनवर कायम दिसेल */
      margin-bottom: 14px;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn-install:active {
      transform: scale(0.98);
      background-color: #b91c1c;
    }
    .btn-start {
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      display: inline-block;
      width: 100%;
      max-width: 320px;
      font-size: 1rem;
    }
    footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: #64748b;
    }
    footer a {
      color: #2563eb;
      text-decoration: none;
      margin: 0 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="./cover.png" alt="STOP DRINK" class="cover-img" onerror="this.style.display='none'">
    
    <h1>मी आज पासून दारू सोडली</h1>
    
    <div class="counter-box">
      ५,२३,८४७+ लोकांनी संकल्प केला
    </div>

    <!-- होम पेजवरील मुख्य Install Button -->
    <button id="installBtn" class="btn-install">
      📲 ॲप इन्स्टॉल करा
    </button>

    <!-- थेट वेबवर वापरण्यासाठी पर्याय -->
    <a href="./register.html" class="btn-start">वेबवर पुढे जा &rarr;</a>
  </div>

  <footer>
    <p>
      <a href="https://www.punepoona.in" target="_blank">punepoona.in</a> • 
      <a href="https://www.claimtak.in" target="_blank">claimtak.in</a> • 
      <a href="https://www.navinpune.com" target="_blank">navinpune.com</a>
    </p>
  </footer>

  <script>
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    // १. Service Worker नोंदणी
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Registered!', reg))
          .catch((err) => console.error('SW Error:', err));
      });
    }

    // २. ब्राऊझरचा इन्स्टॉल इव्हेंट कॅप्चर करणे
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // ३. बटणावर क्लिक झाल्यावर काय व्हावे
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        // जर ब्राऊझरचा प्रॉम्प्ट तयार असेल तर थेट पॉपअप उघडा
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('User choice:', outcome);
        deferredPrompt = null;
      } else {
        // जर प्रॉम्प्ट मिस झाला असेल, तर युझरला मेनूमधून इन्स्टॉल करण्याची सोपी सूचना द्या
        alert('ॲप इन्स्टॉल करण्यासाठी:\nवर उजव्या बाजूला ३ डॉट्सवर (⋮) क्लिक करा आणि "Install and create shortcut" निवडा.');
      }
    });

    // ४. इन्स्टॉल पूर्ण झाल्यावर
    window.addEventListener('appinstalled', () => {
      alert('ॲप यशस्वीरीत्या इन्स्टॉल झाले आहे!');
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
