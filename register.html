<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<title>नोंदणी — मी आज पासून दारू सोडली</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1d1830;--mut:#6b6485;--card:#fff;--line:#ded8ee;--acc:#c0392b;--gold:#e8b64c}
@media(prefers-color-scheme:dark){:root{--bg:#15131f;--fg:#f5f1ff;--mut:#a9a3c2;--card:#201d31;--line:#2f2b46;--acc:#e8590c;--gold:#ffb84d}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Noto Sans Devanagari','Nirmala UI',system-ui,sans-serif;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;min-height:100vh}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;justify-content:center}
h1{font-size:1.5rem;font-weight:800;text-align:center;color:var(--acc);line-height:1.4}
p.sub{text-align:center;color:var(--mut);font-size:.95rem;line-height:1.7;margin-bottom:6px}
label{display:block;font-weight:800;font-size:.95rem;margin-bottom:6px}
input{font:inherit;font-size:1.05rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);width:100%}
input:focus{outline:0;border-color:var(--acc)}
.btn{font:inherit;font-weight:800;font-size:1.15rem;padding:18px;border-radius:16px;border:0;cursor:pointer;text-align:center;text-decoration:none;display:block;background:linear-gradient(135deg,#c0392b,#e8590c);color:#fff;box-shadow:0 10px 24px rgba(192,57,43,.35);margin-top:6px}
.err{color:#c0392b;font-size:.9rem;text-align:center;display:none}
footer{margin-top:20px;text-align:center;font-size:.8rem;color:var(--mut);line-height:1.9}
footer a{color:var(--acc);text-decoration:none;font-weight:600;margin:0 4px}
</style>
</head>
<body>
<main>
  <h1>तुमची ओळख सांगा</h1>
  <p class="sub">हे फक्त तुमच्या मोबाईलमध्ये साठवलं जातं.<br>कोणालाही दिसत नाही.</p>

  <div>
    <label for="name">तुमचं नाव</label>
    <input id="name" type="text" autocomplete="name" placeholder="उदा: राज" maxlength="40">
  </div>

  <div>
    <label for="age">वय</label>
    <input id="age" type="number" inputmode="numeric" min="10" max="110" placeholder="उदा: 35">
  </div>

  <p class="err" id="err">कृपया नाव आणि वय भरा.</p>

  <button class="btn" id="go" type="button">मी आज पासून बंद केली</button>

  <footer>
    <a href="https://punepoona.in">punepoona.in</a>·
    <a href="https://claimtak.in">claimtak.in</a>·
    <a href="https://navinpune.com">navinpune.com</a>
  </footer>
</main>

<script>
(function(){
'use strict';
var $ = function(i){ return document.getElementById(i); };

// आधीच भरलं असेल तर prefill
try {
  $('name').value = localStorage.getItem('sd_name') || '';
  $('age').value  = localStorage.getItem('sd_age')  || '';
} catch(e){}

$('go').addEventListener('click', function(){
  var n = $('name').value.trim();
  var a = parseInt($('age').value, 10);
  if(!n || !a || a < 10 || a > 110){
    $('err').style.display = 'block';
    return;
  }
  try {
    localStorage.setItem('sd_name', n);
    localStorage.setItem('sd_age', String(a));
    localStorage.setItem('sd_start_v1', new Date().toISOString());
    localStorage.setItem('sd_high_v1', '0');
  } catch(e){}
  location.href = './app.html';
});
})();
</script>
</body>
</html>
