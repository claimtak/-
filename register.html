<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>तुमची ओळख सांगा</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#b91c1c">

  <script>
    // १. जर नाव आधीच भरलेले असेल तर पुन्हा हे पेज न दाखवता थेट मेन ॲपवर पाठवा
    if (localStorage.getItem('userName')) {
      window.location.replace('./app.html');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #ffffff;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px 16px;
    }
    .form-container {
      width: 100%;
      max-width: 400px;
      margin-top: 60px;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      color: #b91c1c;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .subtext {
      color: #475569;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 36px;
    }
    .input-group {
      text-align: left;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
      font-size: 1rem;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 1.1rem;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #ea580c;
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(180deg, #ea580c 0%, #c2410c 100%);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(234, 88, 12, 0.3);
      margin-top: 12px;
    }
    .btn-submit:active {
      transform: scale(0.98);
    }
    footer {
      font-size: 0.85rem;
      color: #64748b;
      padding-top: 16px;
      text-align: center;
      width: 100%;
    }
    footer a {
      color: #b91c1c;
      text-decoration: none;
      margin: 0 4px;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h1>तुमची ओळख सांगा</h1>
    <p class="subtext">
      हे फक्त तुमच्या मोबाईलमध्ये साठवलं जातं.<br>कोणालाही दिसत नाही.
    </p>

    <form id="profileForm" onsubmit="saveProfile(event)">
      <div class="input-group">
        <label for="userName">तुमचं नाव</label>
        <input type="text" id="userName" placeholder="तुमचं नाव टाका" required>
      </div>

      <div class="input-group">
        <label for="userAge">वय</label>
        <input type="number" id="userAge" placeholder="वय टाका" min="1" max="120" required>
      </div>

      <button type="submit" class="btn-submit">
        मी आज पासून बंद केली
      </button>
    </form>
  </div>

  <footer>
    <p>
      <a href="https://www.punepoona.in" target="_blank">punepoona.in</a> • 
      <a href="https://www.claimtak.in" target="_blank">claimtak.in</a> • 
      <a href="https://www.navinpune.com" target="_blank">navinpune.com</a>
    </p>
  </footer>

  <script>
    // फॉर्म सबमिट झाल्यावर डेटा कायमस्वरूपी सेव्ह करणे
    function saveProfile(e) {
      e.preventDefault();
      const name = document.getElementById('userName').value.trim();
      const age = document.getElementById('userAge').value.trim();

      if (name && age) {
        // LocalStorage मध्ये माहिती सुरक्षित ठेवणे
        localStorage.setItem('userName', name);
        localStorage.setItem('userAge', age);

        // तारीख आधीपासून नसेल तर आजची तारीख सेट करणे
        if (!localStorage.getItem('quitStartDate')) {
          localStorage.setItem('quitStartDate', new Date().toISOString());
        }

        // थेट ट्रॅकर पेजवर पाठवणे
        window.location.replace('./app.html');
      }
    }
  </script>
</body>
</html>
